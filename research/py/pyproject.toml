[project]
name = "nexus-quant-research"
version = "0.1.0"
description = "Offline research toolkit for NexusQuant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.8",
    "ruff>=0.8",
]

[project.scripts]
nq-research = "nq_research.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
packages = ["nq_research"]
warn_unused_configs = true
disallow_untyped_defs = true
sqlite_cache = false
exclude = ["research[\\\\/]py[\\\\/]nq_research[\\\\/]"]
