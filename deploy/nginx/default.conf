# GateJ-FREEZE nginx config.
#
# Why:
# - The frontend is a static Vite build shipped inside the release package.
# - `/api/**` and actuator health are proxied to the internal `nq-app` service,
#   so the backend host port can stay bound to 127.0.0.1 only.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    location /api/ {
        proxy_pass http://nq-app:18888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    location /actuator/health {
        proxy_pass http://nq-app:18888/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
