spring:
  application:
    name: nexus-quant-app
  profiles:
    # 默认启用本地开发环境；测试/生产通过 NQ_PROFILE 切换。
    active: ${NQ_PROFILE:local}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${NQ_APP_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] trace_id=%X{trace_id} %logger - %msg%n"
