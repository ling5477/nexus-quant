spring:
  application:
    name: nexus-quant-app
  profiles:
    # 默认启用本地开发环境；测试/生产通过 NQ_PROFILE 切换。
    active: ${NQ_PROFILE:local}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${NQ_APP_PORT:18888}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] trace_id=%X{trace_id} %logger - %msg%n"

nq:
  gatec:
    verify:
      # Why: GateC 验收入口默认关闭，避免生产环境误暴露。
      enabled: ${NQ_GATEC_VERIFY_ENABLED:false}
  okx:
    ws:
      # Why: WS 是 GateC-1.1 的可选加速层，默认关闭，避免非预期连私有 WS。
      enabled: ${NQ_OKX_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_OKX_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_OKX_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_OKX_WS_DEGRADE_COOLDOWN_MS:15000}
        subscribe-fail-threshold: ${NQ_OKX_WS_DEGRADE_SUBSCRIBE_FAIL_THRESHOLD:3}
