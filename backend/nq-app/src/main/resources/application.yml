spring:
  application:
    name: nexus-quant-app
  profiles:
    # 默认启用本地开发环境；测试/生产通过 NQ_PROFILE 切换。
    active: ${NQ_PROFILE:local}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${NQ_APP_PORT:18888}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] trace_id=%X{trace_id} %logger - %msg%n"

nq:
  security:
    issuer: ${NQ_SECURITY_ISSUER:nexus-quant}
    secret: ${NQ_SECURITY_SECRET:change-me-change-me-change-me-change-me}
    access-token-ttl: ${NQ_SECURITY_ACCESS_TOKEN_TTL:PT1H}
    users: []
  gated:
    verify:
      # Why: 第四批开始清理 GateC 兼容层，验收入口只认 canonical 开关，避免新旧别名并存继续漂移。
      enabled: ${NQ_GATED_VERIFY_ENABLED:false}
  okx:
    # Why: 第十九批开始把 dome/real 两套凭证切换收口到统一运行时变量；敏感值仍只从环境变量读取，不写入仓库。
    env: ${NQ_OKX_ENV:dome}
    base-url: ${NQ_OKX_BASE_URL:https://www.okx.com}
    api-key: ${NQ_OKX_API_KEY:}
    api-secret: ${NQ_OKX_API_SECRET:}
    api-passphrase: ${NQ_OKX_API_PASSPHRASE:}
    ws-url: ${NQ_OKX_WS_URL:}
    ws:
      # Why: WS 是 GateC-1.1 的可选加速层，默认关闭，避免非预期连私有 WS。
      enabled: ${NQ_OKX_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_OKX_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_OKX_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_OKX_WS_DEGRADE_COOLDOWN_MS:15000}
        subscribe-fail-threshold: ${NQ_OKX_WS_DEGRADE_SUBSCRIBE_FAIL_THRESHOLD:3}
    recovery:
      # Why: formal 环境默认保留恢复链；local 是否启动由 profile 覆写，避免把交易所恢复任务误下沉到纯前端验收流程。
      enabled: ${NQ_OKX_RECOVERY_ENABLED:true}
  binance:
    ws:
      # Why: Binance 私有 WS 在 GateC-2.1 只是可选加速层，默认关闭，避免在未验收环境误连用户数据流。
      enabled: ${NQ_BINANCE_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_BINANCE_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_BINANCE_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_BINANCE_WS_DEGRADE_COOLDOWN_MS:15000}
        reconnect-fail-threshold: ${NQ_BINANCE_WS_DEGRADE_RECONNECT_FAIL_THRESHOLD:2}
