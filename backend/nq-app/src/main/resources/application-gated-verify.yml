spring:
  config:
    activate:
      on-profile: gated-verify
  datasource:
    url: ${NQ_DB_URL:jdbc:postgresql://localhost:${NQ_DB_PORT:15432}/${NQ_DB_NAME:nexus_quant}}
    username: ${NQ_DB_USER:postgres}
    password: ${NQ_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NQ_APP_PORT:18888}

nq:
  runtime:
    trading-components:
      enabled: true
  account:
    credentials:
      master-key: ${NQ_ACCOUNT_CREDENTIALS_MASTER_KEY:gated-verify-account-credentials-master-key-123456}
      key-version: ${NQ_ACCOUNT_CREDENTIALS_KEY_VERSION:1}
      verification-mode: ${NQ_ACCOUNT_CREDENTIALS_VERIFICATION_MODE:STRUCTURAL}
  gated:
    verify:
      # Why: 第四批删除旧 GateC profile 与别名后，`gated-verify` 成为唯一 profile 化验收入口。
      enabled: ${NQ_GATED_VERIFY_ENABLED:true}
