spring:
  config:
    activate:
      on-profile: gatec-verify
  datasource:
    url: ${NQ_DB_URL:jdbc:postgresql://localhost:${NQ_DB_PORT:15432}/${NQ_DB_NAME:nexus_quant}}
    username: ${NQ_DB_USER:postgres}
    password: ${NQ_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NQ_APP_PORT:18888}

nq:
  gatec:
    acceptance:
      enabled: true
