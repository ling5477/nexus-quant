spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${NQ_DB_URL:jdbc:postgresql://localhost:${NQ_DB_PORT:5432}/${NQ_DB_NAME:nexus_quant}}
    username: ${NQ_DB_USER:postgres}
    password: ${NQ_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NQ_APP_PORT:18888}

nq:
  runtime:
    trading-components:
      enabled: true
  account:
    credentials:
      # Why: local 写侧闭环需要真实走 DB 密文路径，但不要求真实外网探活，因此默认启用结构性校验模式。
      master-key: ${NQ_ACCOUNT_CREDENTIALS_MASTER_KEY:local-account-credentials-master-key-123456}
      key-version: ${NQ_ACCOUNT_CREDENTIALS_KEY_VERSION:1}
      verification-mode: ${NQ_ACCOUNT_CREDENTIALS_VERIFICATION_MODE:STRUCTURAL}
  security:
    issuer: ${NQ_SECURITY_ISSUER:nexus-quant-local}
    secret: ${NQ_SECURITY_SECRET:local-change-me-local-change-me-123456}
    access-token-ttl: ${NQ_SECURITY_ACCESS_TOKEN_TTL:PT1H}
    users:
      - username: admin
        password-hash: ${NQ_LOCAL_ADMIN_PASSWORD_HASH:$2a$10$vwD9EsN2B2E/O6DkKhg60ewPvhbERSY9QNGkW1yocbpRk2BOzsO5S}
        roles: [ADMIN, OPERATOR, VIEWER]
        enabled: true
      - username: operator
        password-hash: ${NQ_LOCAL_OPERATOR_PASSWORD_HASH:$2a$10$vwD9EsN2B2E/O6DkKhg60ewPvhbERSY9QNGkW1yocbpRk2BOzsO5S}
        roles: [OPERATOR, VIEWER]
        enabled: true
      - username: viewer
        password-hash: ${NQ_LOCAL_VIEWER_PASSWORD_HASH:$2a$10$vwD9EsN2B2E/O6DkKhg60ewPvhbERSY9QNGkW1yocbpRk2BOzsO5S}
        roles: [VIEWER]
        enabled: true
      - username: disabled
        password-hash: ${NQ_LOCAL_DISABLED_PASSWORD_HASH:$2a$10$vwD9EsN2B2E/O6DkKhg60ewPvhbERSY9QNGkW1yocbpRk2BOzsO5S}
        roles: [VIEWER]
        enabled: false
  gated:
    verify:
      # Why: local 下也默认关闭，只有显式打开 canonical 开关才暴露 GateD 验收入口。
      enabled: ${NQ_GATED_VERIFY_ENABLED:false}
  okx:
    adapter:
      # Why: local smoke 可以显式允许 fallback=true；但 real/dome 真实验收脚本会强制把该值收口为 false，禁止把 stub 冒充成真实 OKX 成功。
      stub-on-bootstrap-failure: ${NQ_OKX_ADAPTER_STUB_ON_BOOTSTRAP_FAILURE:true}
    recovery:
      # Why: local 开发主要验证登录、页面联调和 E2E，不应在启动期强依赖交易所恢复链。
      enabled: ${NQ_OKX_RECOVERY_ENABLED:false}
    ws:
      # Why: local 开发默认仍关闭，需要显式打开 NQ_OKX_WS_ENABLED 才启动 WS smoke runner。
      enabled: ${NQ_OKX_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_OKX_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_OKX_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_OKX_WS_DEGRADE_COOLDOWN_MS:15000}
        subscribe-fail-threshold: ${NQ_OKX_WS_DEGRADE_SUBSCRIBE_FAIL_THRESHOLD:3}
  binance:
    ws:
      # Why: local 开发默认仍关闭，需要显式打开 NQ_BINANCE_WS_ENABLED 才启动 WS smoke runner。
      enabled: ${NQ_BINANCE_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_BINANCE_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_BINANCE_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_BINANCE_WS_DEGRADE_COOLDOWN_MS:15000}
        reconnect-fail-threshold: ${NQ_BINANCE_WS_DEGRADE_RECONNECT_FAIL_THRESHOLD:2}
