spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${NQ_DB_URL:jdbc:postgresql://localhost:${NQ_DB_PORT:5432}/${NQ_DB_NAME:nexus_quant}}
    username: ${NQ_DB_USER:postgres}
    password: ${NQ_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NQ_APP_PORT:18888}

nq:
  gated:
    verify:
      # Why: local 下也默认关闭，只有显式打开 canonical 开关才暴露 GateD 验收入口。
      enabled: ${NQ_GATED_VERIFY_ENABLED:false}
  okx:
    adapter:
      # Why: local smoke 可以显式允许 fallback=true；但 real/dome 真实验收脚本会强制把该值收口为 false，禁止把 stub 冒充成真实 OKX 成功。
      stub-on-bootstrap-failure: ${NQ_OKX_ADAPTER_STUB_ON_BOOTSTRAP_FAILURE:true}
    ws:
      # Why: local 开发默认仍关闭，需要显式打开 NQ_OKX_WS_ENABLED 才启动 WS smoke runner。
      enabled: ${NQ_OKX_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_OKX_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_OKX_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_OKX_WS_DEGRADE_COOLDOWN_MS:15000}
        subscribe-fail-threshold: ${NQ_OKX_WS_DEGRADE_SUBSCRIBE_FAIL_THRESHOLD:3}
  binance:
    ws:
      # Why: local 开发默认仍关闭，需要显式打开 NQ_BINANCE_WS_ENABLED 才启动 WS smoke runner。
      enabled: ${NQ_BINANCE_WS_ENABLED:false}
      smoke:
        force-reconnect-ms: ${NQ_BINANCE_WS_SMOKE_FORCE_RECONNECT_MS:0}
      degrade:
        reconcile-limit: ${NQ_BINANCE_WS_DEGRADE_RECONCILE_LIMIT:100}
        cooldown-ms: ${NQ_BINANCE_WS_DEGRADE_COOLDOWN_MS:15000}
        reconnect-fail-threshold: ${NQ_BINANCE_WS_DEGRADE_RECONNECT_FAIL_THRESHOLD:2}
