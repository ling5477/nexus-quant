spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${NQ_DB_URL:jdbc:postgresql://localhost:${NQ_DB_PORT:15432}/${NQ_DB_NAME:nexus_quant}}
    username: ${NQ_DB_USER:postgres}
    password: ${NQ_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${NQ_APP_PORT:18888}

nq:
  gatec:
    verify:
      # Why: local 下也默认关闭，只有显式打开开关才暴露 /__gatec 入口。
      enabled: ${NQ_GATEC_VERIFY_ENABLED:true}
