name: Authorize fixed legacy transition

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Type AUTHORIZE followed by the full fixed transition SHA256'
        required: true
        type: string
      local_identity_verified:
        description: 'I verified the original installation config and exact candidate bytes locally'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nq-fixed-legacy-transition-authorization
  cancel-in-progress: false

jobs:
  approval-policy:
    if: github.repository == 'ling5477/nexus-quant' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev' && github.actor == 'ling5477' && github.triggering_actor == 'ling5477'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # 先核对既有审批规则，防止引用不存在的Environment时自动创建无保护环境。
      - name: Require configured owner approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/authorize_legacy_transition.py policy

  authorize:
    needs: approval-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: nq-release-transition-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify fixed bytes, source and actual owner review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/authorize_legacy_transition.py prepare --output "$RUNNER_TEMP/transition-authorization"
      - name: Sign explicit authorization, without a build-provenance claim
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/transition-authorization/transition-v1.json
          predicate-type: https://github.com/ling5477/nexus-quant/attestations/legacy-transition-authorization/v1
          predicate-path: ${{ runner.temp }}/transition-authorization/authorization.json
          push-to-registry: false
          create-storage-record: false
      - name: Verify signature and complete authorization claim
        env:
          GH_TOKEN: ${{ github.token }}
          NQ_ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          NQ_ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          NQ_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: python3 scripts/release/authorize_legacy_transition.py verify --output "$RUNNER_TEMP/transition-authorization" --signer-commit "$GITHUB_SHA"
      - name: Retain public proof material only
        if: always() && steps.attest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixed-transition-authorization-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transition-authorization/
          if-no-files-found: error
          retention-days: 90
