name: NQ CI Baseline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-check:
    name: Repository hygiene and governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git show --check --pretty=format: HEAD
          fi

      - name: Run blocking governance regression
        shell: pwsh
        run: |
          ./scripts/docs/test-gate-release-ci-runs.ps1
          ./scripts/docs/test-agent-workflow-fixtures.ps1
          ./scripts/docs/test-current-authority-next-action.ps1
          ./scripts/docs/test-governance-workflow-lifecycle.ps1
          ./scripts/docs/test-gate-archive-manifest.ps1
          ./scripts/docs/check-current-authority.ps1
          ./scripts/docs/check-doc-links.ps1

      - name: Validate canonical delivery workflow contract
        shell: pwsh
        run: |
          ./scripts/ci/Test-CanonicalDeliveryWorkflow.ps1
          ./scripts/ci/tests/Test-CanonicalDeliveryWorkflow.Tests.ps1
          ./scripts/ci/tests/Test-GitleaksExecution.Tests.ps1
          ./scripts/deployment/tests/Test-NqCanonicalRelease.Tests.ps1

  no-outbound-guard:
    name: Runtime safety and no-outbound
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NQ_NO_OUTBOUND: "true"
      # NQ_LIVE_ENABLED / NQ_REAL_PROVIDER_ENABLED / NQ_REAL_CLIENT_ENABLED 不在此注入。
      # Why: 这三个变量名同时被既有 NoOutboundExchangeGuardTest 列为 CI-guard 模式下禁止存在的
      # exchange credential/live env，哪怕值是 "false" 也算违规；而 EnvSafetyGuardConfiguration
      # 对缺省即按 false 处理（absence => false），因此不注入既能保留 5B-ENV fail-closed 语义，
      # 又不破坏 no-outbound guard。请勿在此重新加入这三个变量。
      NQ_AI_ENABLED: "false"
      NQ_DH_RUNTIME_ENABLED: "false"
      NQ_REAL_EXCHANGE_ENABLED: "false"
      NQ_OKX_BASE_URL: PLACEHOLDER_ONLY
      NQ_OKX_WS_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_DOME_BASE_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_REAL_BASE_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_DOME_WS_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_REAL_WS_URL: PLACEHOLDER_ONLY
      NQ_NO_OUTBOUND_DENYLIST: >-
        okx.com
        www.okx.com
        my.okx.com
        binance.com
        api.binance.com
        fapi.binance.com
        dapi.binance.com
        testnet.binance.vision
        ws-api.binance.com
        ws-api.testnet.binance.vision
        stream.binance.com
        stream.binancefuture.com
        bybit.com
        api.bybit.com
        bitget.com
        gate.io
        api.gateio.ws
        coinbase.com
        api.coinbase.com
        kraken.com
        api.kraken.com
        crypto.com
        hyperliquid.xyz
        api.hyperliquid.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify no exchange credential env is injected
        shell: bash
        run: |
          set -euo pipefail

          forbidden_env_names=(
            NQ_OKX_API_KEY
            NQ_OKX_API_SECRET
            NQ_OKX_API_PASSPHRASE
            NQ_OKX_DOME_API_KEY
            NQ_OKX_DOME_API_SECRET
            NQ_OKX_DOME_API_PASSPHRASE
            NQ_OKX_REAL_API_KEY
            NQ_OKX_REAL_API_SECRET
            NQ_OKX_REAL_API_PASSPHRASE
            NQ_BINANCE_DOME_API_KEY
            NQ_BINANCE_DOME_API_SECRET
            NQ_BINANCE_DOME_PRIVATE_KEY
            NQ_BINANCE_DOME_PRIVATE_KEY_PATH
            NQ_BINANCE_REAL_API_KEY
            NQ_BINANCE_REAL_API_SECRET
            NQ_BINANCE_REAL_PRIVATE_KEY
            NQ_BINANCE_REAL_PRIVATE_KEY_PATH
            NQ_BINANCE_WS_DIAGNOSTIC_ENABLED
            NQ_BINANCE_WS_LIVE_DIAGNOSTIC
          )

          for name in "${forbidden_env_names[@]}"; do
            if [[ -n "${!name-}" ]]; then
              echo "Forbidden exchange credential env is set: ${name}" >&2
              exit 1
            fi
          done

          forbidden_true_names=(
            NQ_LIVE_ENABLED
            NQ_AI_ENABLED
            NQ_DH_RUNTIME_ENABLED
            NQ_REAL_PROVIDER_ENABLED
            NQ_REAL_CLIENT_ENABLED
            NQ_REAL_EXCHANGE_ENABLED
          )

          for name in "${forbidden_true_names[@]}"; do
            if [[ "${!name-}" == "true" ]]; then
              echo "Forbidden CI/test runtime flag is true: ${name}" >&2
              exit 1
            fi
          done

      - name: Verify exchange denylist coverage
        shell: bash
        run: |
          set -euo pipefail

          required_hosts=(
            okx.com
            www.okx.com
            my.okx.com
            binance.com
            api.binance.com
            fapi.binance.com
            dapi.binance.com
            testnet.binance.vision
            ws-api.binance.com
            ws-api.testnet.binance.vision
            stream.binance.com
            stream.binancefuture.com
            bybit.com
            api.bybit.com
            bitget.com
            gate.io
            api.gateio.ws
            coinbase.com
            api.coinbase.com
            kraken.com
            api.kraken.com
            crypto.com
            hyperliquid.xyz
            api.hyperliquid.xyz
          )

          for host in "${required_hosts[@]}"; do
            if [[ " ${NQ_NO_OUTBOUND_DENYLIST} " != *" ${host} "* ]]; then
              echo "No-outbound denylist missing required host: ${host}" >&2
              exit 1
            fi
          done

      - name: Run consolidated runtime safety regression
        shell: bash
        run: |
          set -euo pipefail

          # One explicit security boundary job owns env fail-closed, no-outbound and no-real probe coverage.
          # Backend regression still runs the complete suite; no second partial security job repeats this allowlist.
          mvn -f backend/pom.xml -pl nq-app,nq-infra -am test \
            -Dtest=EnvSafetyValidatorTest,NoOutboundExchangeGuardTest,NoRealExchangeCredentialPermissionProbePortTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dnq.no-outbound.guard.required=true

  backend:
    name: Backend regression
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: nexus_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_quant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NQ_NO_OUTBOUND: "true"
      # NQ_LIVE_ENABLED / NQ_REAL_PROVIDER_ENABLED / NQ_REAL_CLIENT_ENABLED 不在此注入。
      # Why: 同 no-outbound-guard job —— 这三个变量名被既有 NoOutboundExchangeGuardTest 列为
      # CI-guard 模式下禁止存在的 exchange credential/live env（值为 "false" 也违规），而
      # EnvSafetyGuardConfiguration 缺省即按 false 处理，故不注入即可保留 fail-closed 语义。
      NQ_AI_ENABLED: "false"
      NQ_DH_RUNTIME_ENABLED: "false"
      NQ_REAL_EXCHANGE_ENABLED: "false"
      NQ_OKX_BASE_URL: PLACEHOLDER_ONLY
      NQ_OKX_WS_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_DOME_BASE_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_REAL_BASE_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_DOME_WS_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_REAL_WS_URL: PLACEHOLDER_ONLY
      NQ_DB_URL: jdbc:postgresql://localhost:5432/nexus_quant
      NQ_DB_USER: postgres
      NQ_DB_PASSWORD: "123456"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run production configuration fail-closed regression
        shell: bash
        run: mvn -f backend/pom.xml -pl nq-app -am test -Dtest=ProductionConfigurationApplicationContextInitializerTest,ProductionSecretProfileRegressionTest -Dsurefire.failIfNoSpecifiedTests=false

      - name: Prepare backend CI legacy account fixture
        shell: bash
        run: |
          set -euo pipefail

          fixture_dir="${RUNNER_TEMP}/nq-backend-ci-fixture"
          mkdir -p "${fixture_dir}"

          mvn -f backend/pom.xml -pl nq-app -am process-classes \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -DincludeScope=runtime \
            -Dmdep.outputFile=target/backend-ci-fixture-classpath.txt

          app_cp="$(cat backend/nq-app/target/backend-ci-fixture-classpath.txt)"
          classpath="backend/nq-app/target/classes:backend/nq-infra/target/classes:${app_cp}"

          javac -cp "${classpath}" -d "${fixture_dir}" scripts/ci/BackendCiLegacyAccountFixture.java
          java -cp "${fixture_dir}:${classpath}" BackendCiLegacyAccountFixture

      - name: Run backend tests
        shell: bash
        # Reuse the job's disposable PostgreSQL contract for integration tests that need
        # Spring's canonical datasource names. Keep the aliases scoped to Maven tests so
        # fixture preparation and unrelated jobs retain their existing environment.
        env:
          SPRING_DATASOURCE_URL: ${{ env.NQ_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ env.NQ_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.NQ_DB_PASSWORD }}
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml test

  postgres-flyway:
    name: PostgreSQL and Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: nq_ci_user
          POSTGRES_PASSWORD: nq_ci_password
          POSTGRES_DB: nq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nq_ci_user -d nq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NQ_FLYWAY_DB_URL: jdbc:postgresql://localhost:5432/nq_ci
      NQ_FLYWAY_DB_USER: nq_ci_user
      NQ_FLYWAY_DB_PASSWORD: nq_ci_password

    steps:
      - name: Mask CI-only PostgreSQL connection values
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${NQ_FLYWAY_DB_URL}"
          echo "::add-mask::${NQ_FLYWAY_DB_USER}"
          echo "::add-mask::${NQ_FLYWAY_DB_PASSWORD}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Prepare Flyway runtime classpath
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-app -am process-classes \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -DincludeScope=runtime \
            -Dmdep.outputFile=target/flyway-classpath.txt

      - name: Run empty database Flyway smoke
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir="${RUNNER_TEMP}/nq-flyway-smoke"
          mkdir -p "${smoke_dir}"

          cat > "${smoke_dir}/FlywaySmoke.java" <<'JAVA'
          import java.sql.Connection;
          import java.sql.DriverManager;
          import java.sql.ResultSet;
          import java.sql.Statement;

          import org.flywaydb.core.Flyway;
          import org.flywaydb.core.api.MigrationInfo;

          public final class FlywaySmoke {
              private FlywaySmoke() {
              }

              public static void main(String[] args) throws Exception {
                  String url = requireEnv("NQ_FLYWAY_DB_URL");
                  String user = requireEnv("NQ_FLYWAY_DB_USER");
                  String password = requireEnv("NQ_FLYWAY_DB_PASSWORD");

                  Flyway flyway = Flyway.configure()
                          .dataSource(url, user, password)
                          .locations("classpath:db/migration")
                          .baselineOnMigrate(false)
                          .cleanDisabled(true)
                          .outOfOrder(false)
                          .load();

                  flyway.migrate();
                  flyway.validate();

                  MigrationInfo current = flyway.info().current();
                  if (current == null || current.getVersion() == null) {
                      throw new IllegalStateException(
                              "Flyway did not produce a current schema version");
                  }

                  MigrationInfo[] pending = flyway.info().pending();
                  if (pending.length != 0) {
                      throw new IllegalStateException(
                              "Flyway still has " + pending.length + " pending migrations");
                  }

                  String currentVersion = current.getVersion().getVersion();

                  try (Connection connection = DriverManager.getConnection(url, user, password);
                          Statement statement = connection.createStatement();
                          ResultSet resultSet = statement.executeQuery("""
                                  SELECT installed_rank, version, description, type, script, checksum, success
                                  FROM flyway_schema_history
                                  ORDER BY installed_rank
                                  """)) {
                      System.out.println("installed_rank|version|description|type|script|checksum|success");
                      while (resultSet.next()) {
                          System.out.printf("%d|%s|%s|%s|%s|%s|%s%n",
                                  resultSet.getInt("installed_rank"),
                                  resultSet.getString("version"),
                                  resultSet.getString("description"),
                                  resultSet.getString("type"),
                                  resultSet.getString("script"),
                                  resultSet.getString("checksum"),
                                  resultSet.getBoolean("success"));
                      }
                  }

                  System.out.println("Flyway empty database smoke reached V" + currentVersion);
              }

              private static String requireEnv(String name) {
                  String value = System.getenv(name);
                  if (value == null || value.isBlank()) {
                      throw new IllegalStateException("Missing required environment variable: " + name);
                  }
                  return value;
              }
          }
          JAVA

          app_cp="$(cat backend/nq-app/target/flyway-classpath.txt)"
          classpath="backend/nq-app/target/classes:backend/nq-infra/target/classes:${app_cp}"

          javac -cp "${classpath}" "${smoke_dir}/FlywaySmoke.java"
          java -cp "${smoke_dir}:${classpath}" FlywaySmoke

      - name: Generate PostgreSQL schema artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/postgres-flyway"
          mkdir -p "${artifact_dir}"

          nq_ci_psql_url="host=localhost port=5432 dbname=nq_ci user=nq_ci_user sslmode=disable"
          export PGPASSWORD="${NQ_FLYWAY_DB_PASSWORD}"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -Atc "
          SELECT installed_rank, version, description, type, script, checksum, installed_on, execution_time, success
          FROM flyway_schema_history
          ORDER BY installed_rank;
          " > "${artifact_dir}/flyway-info.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT table_schema, table_name, table_type
          FROM information_schema.tables
          WHERE table_schema = 'public'
          ORDER BY table_schema, table_name;
          " > "${artifact_dir}/schema-tables.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT table_schema, table_name, ordinal_position, column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_schema = 'public'
          ORDER BY table_schema, table_name, ordinal_position;
          " > "${artifact_dir}/schema-columns.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT con.conname AS constraint_name,
                 CASE con.contype
                   WHEN 'p' THEN 'PRIMARY KEY'
                   WHEN 'u' THEN 'UNIQUE'
                   WHEN 'f' THEN 'FOREIGN KEY'
                   WHEN 'c' THEN 'CHECK'
                   ELSE con.contype::text
                 END AS constraint_type,
                 nsp.nspname AS schema_name,
                 rel.relname AS table_name,
                 pg_get_constraintdef(con.oid) AS definition
          FROM pg_constraint con
          JOIN pg_class rel ON rel.oid = con.conrelid
          JOIN pg_namespace nsp ON nsp.oid = rel.relnamespace
          WHERE nsp.nspname = 'public'
          ORDER BY nsp.nspname, rel.relname, con.conname;
          " > "${artifact_dir}/schema-constraints.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT schemaname, tablename, indexname, indexdef
          FROM pg_indexes
          WHERE schemaname = 'public'
          ORDER BY tablename, indexname;
          " > "${artifact_dir}/schema-indexes.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT 'table' AS object_type,
                 n.nspname AS schema_name,
                 c.relname AS table_name,
                 NULL::text AS column_name,
                 obj_description(c.oid, 'pg_class') AS comment
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p')
          UNION ALL
          SELECT 'column' AS object_type,
                 n.nspname AS schema_name,
                 c.relname AS table_name,
                 a.attname AS column_name,
                 col_description(c.oid, a.attnum) AS comment
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          JOIN pg_attribute a ON a.attrelid = c.oid
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p')
            AND a.attnum > 0
            AND NOT a.attisdropped
          ORDER BY schema_name, table_name, object_type, column_name NULLS FIRST;
          " > "${artifact_dir}/schema-comments.txt"

          pg_dump --schema-only --no-owner --no-privileges "${nq_ci_psql_url}" > "${artifact_dir}/schema-dump.sql"

      - name: Pre-upload redaction gate (PostgreSQL schema artifacts)
        shell: bash
        run: |
          set -euo pipefail

          # Reusable pre-upload redaction gate (Batch 4C-B). Contract: run this BEFORE any
          # actions/upload-artifact step. It scans ONLY the CI-generated artifact directory
          # (never .env / secrets / local forbidden dirs), fails closed on any high-risk
          # credential pattern, and reports rule + file ONLY (never source content). Currently applied to the single
          # nq-postgres-flyway-schema-artifacts upload; future text artifacts must call the
          # same gate before uploading. Binary / zip artifacts are rejected here (Batch 5).
          gate_target="artifacts/postgres-flyway"

          required_artifacts=(
            "flyway-info.txt"
            "schema-tables.txt"
            "schema-columns.txt"
            "schema-constraints.txt"
            "schema-indexes.txt"
            "schema-comments.txt"
            "schema-dump.sql"
          )

          for artifact in "${required_artifacts[@]}"; do
            test -s "${gate_target}/${artifact}"
          done

          # Binary / zip handling: text artifacts only. Reject any binary file (zip / video /
          # screenshot etc.) so we never run unreliable text grep over binary content. Future
          # Playwright / binary report uploads are Batch 5 and must define their own handling
          # before reusing this gate.
          while IFS= read -r -d '' f; do
            if [ "$(file -b --mime-encoding "${f}")" = "binary" ]; then
              echo "Pre-upload redaction gate: non-text (binary) artifact rejected: ${f#"${gate_target}/"}" >&2
              echo "Binary/zip artifacts are deferred to Batch 5 and must not be uploaded by this path." >&2
              exit 1
            fi
          done < <(find "${gate_target}" -type f -print0)

          # schema-dump specific supplement (carried over, hardened to -q so source content is
          # never printed): the schema-only dump must not contain data rows.
          if grep -qE '(^INSERT INTO |^COPY .+ FROM stdin;|^-- Data for Name:|^\\\.)' "${gate_target}/schema-dump.sql"; then
            echo "Pre-upload redaction gate: schema-dump.sql appears to contain data rows" >&2
            exit 1
          fi

          # Credential redaction scan: union of the prior schema-check patterns and the Batch 4B
          # backstop high-risk items (must not be weaker than the prior schema-check). Checked
          # per rule so we report rule + file WITHOUT printing source content. Pattern text is
          # assembled at runtime so the Actions command echo does not contain complete sensitive
          # key shapes while artifact detection strength remains unchanged.
          patterns="${RUNNER_TEMP}/nq-preupload-gate-patterns.txt"
          violations="${RUNNER_TEMP}/nq-preupload-gate-violations.txt"
          : > "${violations}"

          append_redaction_rule() {
            local rule="$1"
            shift
            printf '%s ' "${rule}" >> "${patterns}"
            printf '%s' "$@" >> "${patterns}"
            printf '\n' >> "${patterns}"
          }

          append_redaction_rule "dotenv_reference" '\.env'
          append_redaction_rule "pem_private_key" "BEGIN [A-Z ]*" "PRIVATE" " " "KEY"
          append_redaction_rule "aws_akia_key" 'AKIA[0-9A-Z]{16}'
          append_redaction_rule "aws_asia_key" 'ASIA[0-9A-Z]{16}'
          append_redaction_rule "openai_anthropic_key" 'sk-[A-Za-z0-9_-]{20,}'
          append_redaction_rule "github_token" '(gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,})'
          append_redaction_rule "slack_token" 'xox[bp]-[A-Za-z0-9-]{10,}'
          append_redaction_rule "credentials_in_url" '[a-zA-Z][a-zA-Z0-9+.-]*://[^/@[:space:]]+:[^/@[:space:]]+@'
          append_redaction_rule "api_key_assignment" "(api" "Key|api[_-]?key)[[:space:]]*[:=]"
          append_redaction_rule "api_secret_assignment" "(api" "Secret|api[_-]?secret|sec" "ret)[[:space:]]*[:=]"
          append_redaction_rule "passphrase_assignment" "pass" "phrase[[:space:]]*[:=]"
          append_redaction_rule "token_assignment" "to" "ken[[:space:]]*[:=]"
          append_redaction_rule "password_assignment" 'password[[:space:]]*[:=]'
          append_redaction_rule "cookie_assignment" "co" "okie[[:space:]]*[:=]"
          append_redaction_rule "private_key_assignment" "(private" "Key|private[[:space:]_-]*key)[[:space:]]*[:=]"
          append_redaction_rule "mnemonic_assignment" 'mnemonic[[:space:]]*[:=]'
          append_redaction_rule "signature_assignment" "signa" "ture[[:space:]]*[:=]"
          append_redaction_rule "credential_material_assignment" 'credential[[:space:]_-]*material[[:space:]]*[:=]'
          append_redaction_rule "raw_req_assignment" "raw" "[[:space:]_-]*request[[:space:]]*[:=]"
          append_redaction_rule "raw_resp_assignment" "raw" "[[:space:]_-]*response[[:space:]]*[:=]"
          append_redaction_rule "encrypted_payload_assignment" 'encrypted_payload[[:space:]]*[:=]'
          append_redaction_rule "decrypted_payload_assignment" 'decrypted_payload[[:space:]]*[:=]'

          while IFS=' ' read -r rule re; do
            [ -z "${rule}" ] && continue
            # -l: list matching files only (never source content). -I: skip binary (already rejected).
            files="$(grep -rIlE -e "${re}" "${gate_target}" 2>/dev/null || true)"
            [ -z "${files}" ] && continue
            while IFS= read -r mf; do
              [ -z "${mf}" ] && continue
              echo "${rule} | ${mf#"${gate_target}/"}" >> "${violations}"
            done <<< "${files}"
          done < "${patterns}"

          if [ -s "${violations}" ]; then
            echo "Pre-upload redaction gate found high-risk credential pattern(s) (rule | file only; values never printed):" >&2
            cat "${violations}" >&2
            echo "Remove the credential material from the generated artifact. Failing CI (fail closed)." >&2
            exit 1
          fi
          echo "Pre-upload redaction gate: no high-risk credential pattern in ${gate_target} (text-only, fail closed)."

      - name: Upload PostgreSQL schema artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nq-postgres-flyway-schema-artifacts
          path: artifacts/postgres-flyway/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 14 || 7 }}

      - name: Run repository PostgreSQL smoke
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-infra -am test \
            -Dtest=JdbcRepositoryPostgresSmokeTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dnq.postgres.smoke.required=true \
            -Dnq.postgres.smoke.url="${NQ_FLYWAY_DB_URL}" \
            -Dnq.postgres.smoke.user="${NQ_FLYWAY_DB_USER}" \
            -Dnq.postgres.smoke.password="${NQ_FLYWAY_DB_PASSWORD}"

      - name: Run nq-app PostgreSQL context smoke
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-app -am test \
            -Dtest=NqAppContextPostgresSmokeTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dnq.app.context.smoke.required=true \
            -Dnq.app.context.smoke.url="${NQ_FLYWAY_DB_URL}" \
            -Dnq.app.context.smoke.user="${NQ_FLYWAY_DB_USER}" \
            -Dnq.app.context.smoke.password="${NQ_FLYWAY_DB_PASSWORD}"

      - name: Run current-schema backup and restore drill
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/deployment/Invoke-NqCanonicalRestoreCi.ps1 -SourceCommit $env:NQ_SOURCE_COMMIT

      - name: Verify canonical backup creation and integrity
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/deployment/Test-NqCanonicalRestoreProof.ps1 -Capability BACKUP_INTEGRITY -ProofRoot 'artifacts/phase5b-current-schema-restore' -ExpectedCommit $env:NQ_SOURCE_COMMIT

      - name: Verify canonical post-restore validation
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/deployment/Test-NqCanonicalRestoreProof.ps1 -Capability POST_RESTORE_VALIDATION -ProofRoot 'artifacts/phase5b-current-schema-restore' -ExpectedCommit $env:NQ_SOURCE_COMMIT

  frontend-critical:
    name: Frontend build and critical E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_DB: nexus_quant
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_quant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NQ_CRITICAL_E2E_REQUIRED: "true"
      NQ_NO_OUTBOUND: "true"
      # Forbidden credential and LIVE env names remain absent; missing values are the fail-closed contract.
      NQ_AI_ENABLED: "false"
      NQ_DH_RUNTIME_ENABLED: "false"
      NQ_REAL_EXCHANGE_ENABLED: "false"
      NQ_APP_PORT: "18888"
      NQ_DB_URL: jdbc:postgresql://localhost:5432/nexus_quant
      NQ_DB_USER: nexus
      NQ_DB_PASSWORD: nexus
      NQ_OKX_BASE_URL: PLACEHOLDER_ONLY
      NQ_OKX_WS_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_DOME_BASE_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_REAL_BASE_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_DOME_WS_URL: PLACEHOLDER_ONLY
      NQ_BINANCE_REAL_WS_URL: PLACEHOLDER_ONLY
      NQ_INSTRUMENT_CATALOG_SYNC_ENABLED: "false"
      NQ_OKX_RECOVERY_ENABLED: "false"
      NQ_OKX_WS_ENABLED: "false"
      NQ_BINANCE_WS_ENABLED: "false"

    steps:
      - name: Mask CI-only PostgreSQL connection values
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${NQ_DB_URL}"
          echo "::add-mask::${NQ_DB_USER}"
          echo "::add-mask::${NQ_DB_PASSWORD}"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production artifact
        working-directory: frontend
        run: npm run build

      - name: Generate normalized frontend CycloneDX SBOM and artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="artifacts/delivery/frontend"
          mkdir -p "${evidence_root}/artifacts"
          (cd frontend && npm sbom --sbom-format cyclonedx --omit=dev) > "${evidence_root}/frontend-sbom.raw.json"
          cp -a frontend/dist "${evidence_root}/artifacts/dist"
          pwsh -NoProfile -File scripts/ci/Normalize-CycloneDxSbom.ps1 \
            -InputPath "${evidence_root}/frontend-sbom.raw.json" \
            -OutputPath "${evidence_root}/frontend-sbom.cdx.json"
          pwsh -NoProfile -File scripts/ci/New-DeliveryArtifactManifest.ps1 \
            -ArtifactPath "${evidence_root}/artifacts" \
            -RepositoryRoot "${evidence_root}" \
            -ArtifactSetName frontend-production-dist \
            -OutputPath "${evidence_root}/frontend-artifact-manifest.json"
          rm "${evidence_root}/frontend-sbom.raw.json"
          pwsh -NoProfile -File scripts/ci/Test-DeliveryArtifactSafety.ps1 \
            -EvidenceRoot "${evidence_root}"

      - name: Package backend application artifact
        shell: bash
        run: |
          set -euo pipefail
          mvn -f backend/pom.xml -pl nq-app -am -DskipTests install
          mvn -f backend/nq-app/pom.xml -DskipTests package spring-boot:repackage

      - name: Generate normalized backend CycloneDX SBOM and artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          mvn -f backend/pom.xml -DskipTests \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom \
            -DoutputFormat=json -DoutputName=backend-sbom -DoutputReactorProjects=false
          evidence_root="artifacts/delivery/backend"
          mkdir -p "${evidence_root}/artifacts"
          cp backend/target/backend-sbom.json "${evidence_root}/backend-sbom.raw.json"
          cp backend/nq-app/target/nq-app-0.1.0-SNAPSHOT.jar "${evidence_root}/artifacts/nq-app.jar"
          pwsh -NoProfile -File scripts/ci/Normalize-CycloneDxSbom.ps1 \
            -InputPath "${evidence_root}/backend-sbom.raw.json" \
            -OutputPath "${evidence_root}/backend-sbom.cdx.json"
          pwsh -NoProfile -File scripts/ci/New-DeliveryArtifactManifest.ps1 \
            -ArtifactPath "${evidence_root}/artifacts" \
            -RepositoryRoot "${evidence_root}" \
            -ArtifactSetName backend-application \
            -OutputPath "${evidence_root}/backend-artifact-manifest.json"
          rm "${evidence_root}/backend-sbom.raw.json"
          pwsh -NoProfile -File scripts/ci/Test-DeliveryArtifactSafety.ps1 \
            -EvidenceRoot "${evidence_root}"

      - name: Build canonical release and external admission
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/deployment/Build-NqCanonicalReleaseCi.ps1 -SourceCommit $env:NQ_SOURCE_COMMIT

      - name: Verify canonical release and external admission
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/deployment/Test-NqCanonicalReleaseCi.ps1 -SourceCommit $env:NQ_SOURCE_COMMIT

      - name: Install and activate admitted canonical release
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
        run: ./scripts/deployment/Install-NqCanonicalReleaseCi.ps1 -SourceCommit $env:NQ_SOURCE_COMMIT

      - name: Install Playwright Chromium
        working-directory: frontend
        timeout-minutes: 15
        run: npx --no-install playwright install --with-deps chromium

      - name: Run loopback critical E2E allowlist
        working-directory: frontend
        run: |
          npm run test:e2e -- \
            login-page-smoke.spec.ts \
            strategy-validation-paper-shadow-smoke.spec.ts \
            validation-review-workbench-smoke.spec.ts \
            --project=chromium

      - name: Start nq-app local backend
        shell: bash
        run: |
          set -euo pipefail
          raw_log="${RUNNER_TEMP}/nq-critical-e2e-backend.raw.log"
          pid_file="${RUNNER_TEMP}/nq-critical-e2e-backend.pid"
          : > "${raw_log}"
          setsid mvn -f backend/pom.xml -pl nq-app -am -DskipTests spring-boot:run \
            -Dspring-boot.run.profiles=local > "${raw_log}" 2>&1 &
          echo "$!" > "${pid_file}"

      - name: Wait for backend health UP
        shell: bash
        run: |
          set -euo pipefail
          health_url="http://127.0.0.1:18888/actuator/health"
          raw_log="${RUNNER_TEMP}/nq-critical-e2e-backend.raw.log"
          for _ in {1..120}; do
            if curl -fsS "${health_url}" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Backend health is UP."
              exit 0
            fi
            sleep 1
          done
          echo "Backend health did not reach UP. Sanitized bounded tail follows:" >&2
          sed -E 's/((apiKey|api[_-]?key|apiSecret|api[_-]?secret|secret|token|signature|passphrase|password|cookie)[[:space:]]*[:=][[:space:]]*)[^[:space:]]+/\1<redacted>/Ig' "${raw_log}" | tail -n 120 >&2
          exit 1

      - name: Run real-backend critical E2E allowlist
        working-directory: frontend
        env:
          VITE_API_PROXY_TARGET: http://127.0.0.1:18888
        run: |
          npm run test:e2e -- \
            runtime-operational-readiness-final-smoke.spec.ts \
            adapter-readiness-panel-backend-smoke.spec.ts \
            --project=chromium

      - name: Cleanup backend and Playwright output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          pid_file="${RUNNER_TEMP}/nq-critical-e2e-backend.pid"
          if [ -f "${pid_file}" ]; then
            pid="$(cat "${pid_file}")"
            if [[ "${pid}" =~ ^[0-9]+$ ]]; then
              kill -TERM -- "-${pid}" 2>/dev/null || kill -TERM "${pid}" 2>/dev/null || true
              for _ in {1..20}; do
                kill -0 "${pid}" 2>/dev/null || break
                sleep 0.25
              done
              kill -KILL -- "-${pid}" 2>/dev/null || kill -KILL "${pid}" 2>/dev/null || true
            fi
          fi
          rm -rf frontend/test-results-ci frontend/playwright-report frontend/test-results

      - name: Validate deterministic delivery evidence tooling
        shell: pwsh
        run: ./scripts/ci/tests/Test-DeliveryEvidence.ps1

      - name: Generate internal provenance manifest
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
          NQ_CI_RUN_ID: ${{ github.run_id }}
          NQ_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          NQ_REPOSITORY: ${{ github.repository }}
          NQ_REF: ${{ github.ref }}
          NQ_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1) -replace '"', ''
          $nodeVersion = (& node --version).Trim()
          $npmVersion = (& npm --version).Trim()
          ./scripts/ci/New-InternalProvenance.ps1 `
            -SourceCommit $env:NQ_SOURCE_COMMIT `
            -CiRunId $env:NQ_CI_RUN_ID `
            -CiRunAttempt $env:NQ_CI_RUN_ATTEMPT `
            -Repository $env:NQ_REPOSITORY `
            -Ref $env:NQ_REF `
            -WorkflowName $env:NQ_WORKFLOW_NAME `
            -WorkflowPath '.github/workflows/ci.yml' `
            -WorkflowFilePath '.github/workflows/ci.yml' `
            -SupplyChainLockPath 'scripts/ci/delivery-supply-chain-lock.json' `
            -JavaVersion $javaVersion `
            -NodeVersion $nodeVersion `
            -NpmVersion $npmVersion `
            -BackendEvidenceRoot 'artifacts/delivery/backend' `
            -FrontendEvidenceRoot 'artifacts/delivery/frontend' `
            -BackendSbomPath 'artifacts/delivery/backend/backend-sbom.cdx.json' `
            -FrontendSbomPath 'artifacts/delivery/frontend/frontend-sbom.cdx.json' `
            -BackendArtifactManifestPath 'artifacts/delivery/backend/backend-artifact-manifest.json' `
            -FrontendArtifactManifestPath 'artifacts/delivery/frontend/frontend-artifact-manifest.json' `
            -OutputPath 'artifacts/delivery/provenance/internal-provenance.json'

      - name: Validate internal provenance admission
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
          NQ_CI_RUN_ID: ${{ github.run_id }}
          NQ_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          NQ_REPOSITORY: ${{ github.repository }}
          NQ_REF: ${{ github.ref }}
          NQ_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1) -replace '"', ''
          $nodeVersion = (& node --version).Trim()
          $npmVersion = (& npm --version).Trim()
          ./scripts/ci/Test-InternalProvenance.ps1 `
            -ProvenancePath 'artifacts/delivery/provenance/internal-provenance.json' `
            -ExpectedSourceCommit $env:NQ_SOURCE_COMMIT `
            -ExpectedCiRunId $env:NQ_CI_RUN_ID `
            -ExpectedCiRunAttempt $env:NQ_CI_RUN_ATTEMPT `
            -ExpectedRepository $env:NQ_REPOSITORY `
            -ExpectedRef $env:NQ_REF `
            -ExpectedWorkflowName $env:NQ_WORKFLOW_NAME `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ExpectedJavaVersion $javaVersion `
            -ExpectedNodeVersion $nodeVersion `
            -ExpectedNpmVersion $npmVersion `
            -WorkflowFilePath '.github/workflows/ci.yml' `
            -SupplyChainLockPath 'scripts/ci/delivery-supply-chain-lock.json' `
            -BackendEvidenceRoot 'artifacts/delivery/backend' `
            -FrontendEvidenceRoot 'artifacts/delivery/frontend' `
            -BackendSbomPath 'artifacts/delivery/backend/backend-sbom.cdx.json' `
            -FrontendSbomPath 'artifacts/delivery/frontend/frontend-sbom.cdx.json' `
            -BackendArtifactManifestPath 'artifacts/delivery/backend/backend-artifact-manifest.json' `
            -FrontendArtifactManifestPath 'artifacts/delivery/frontend/frontend-artifact-manifest.json'

      - name: Upload backend delivery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-delivery-evidence
          path: artifacts/delivery/backend/
          if-no-files-found: error
          retention-days: 14

      - name: Upload frontend delivery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-delivery-evidence
          path: artifacts/delivery/frontend/
          if-no-files-found: error
          retention-days: 14

      - name: Upload internal provenance manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: internal-delivery-provenance
          path: artifacts/delivery/provenance/
          if-no-files-found: error
          retention-days: 14

  delivery-provenance:
    name: Delivery SBOM and provenance
    runs-on: ubuntu-latest
    needs: [backend, frontend-critical]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Download backend and frontend delivery evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-delivery-evidence"
          path: artifacts/delivery-input
          merge-multiple: false

      - name: Download internal provenance manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: internal-delivery-provenance
          path: artifacts/delivery-input/provenance

      - name: Validate uploaded provenance readback
        shell: pwsh
        env:
          NQ_SOURCE_COMMIT: ${{ github.sha }}
          NQ_CI_RUN_ID: ${{ github.run_id }}
          NQ_CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          NQ_REPOSITORY: ${{ github.repository }}
          NQ_REF: ${{ github.ref }}
          NQ_WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          $javaVersion = (& java -version 2>&1 | Select-Object -First 1) -replace '"', ''
          $nodeVersion = (& node --version).Trim()
          $npmVersion = (& npm --version).Trim()
          ./scripts/ci/Test-InternalProvenance.ps1 `
            -ProvenancePath 'artifacts/delivery-input/provenance/internal-provenance.json' `
            -ExpectedSourceCommit $env:NQ_SOURCE_COMMIT `
            -ExpectedCiRunId $env:NQ_CI_RUN_ID `
            -ExpectedCiRunAttempt $env:NQ_CI_RUN_ATTEMPT `
            -ExpectedRepository $env:NQ_REPOSITORY `
            -ExpectedRef $env:NQ_REF `
            -ExpectedWorkflowName $env:NQ_WORKFLOW_NAME `
            -ExpectedWorkflowPath '.github/workflows/ci.yml' `
            -ExpectedJavaVersion $javaVersion `
            -ExpectedNodeVersion $nodeVersion `
            -ExpectedNpmVersion $npmVersion `
            -WorkflowFilePath '.github/workflows/ci.yml' `
            -SupplyChainLockPath 'scripts/ci/delivery-supply-chain-lock.json' `
            -BackendEvidenceRoot 'artifacts/delivery-input/backend-delivery-evidence' `
            -FrontendEvidenceRoot 'artifacts/delivery-input/frontend-delivery-evidence' `
            -BackendSbomPath 'artifacts/delivery-input/backend-delivery-evidence/backend-sbom.cdx.json' `
            -FrontendSbomPath 'artifacts/delivery-input/frontend-delivery-evidence/frontend-sbom.cdx.json' `
            -BackendArtifactManifestPath 'artifacts/delivery-input/backend-delivery-evidence/backend-artifact-manifest.json' `
            -FrontendArtifactManifestPath 'artifacts/delivery-input/frontend-delivery-evidence/frontend-artifact-manifest.json'
  research:
    name: Research quality
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    defaults:
      run:
        working-directory: research/py

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/py/pyproject.toml

      - name: Install research dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run mypy
        run: python -m mypy src --no-sqlite-cache

      - name: Run ruff
        run: python -m ruff check . --no-cache

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Load canonical gitleaks identity
        shell: pwsh
        run: |
          ./scripts/ci/Export-DeliveryToolIdentity.ps1 `
            -ToolName gitleaks `
            -Platform linux `
            -Architecture x64 `
            -GitHubEnvPath $env:GITHUB_ENV

      - name: Install verified gitleaks CLI in runner temp
        shell: bash
        run: |
          set -euo pipefail

          work="$(mktemp -d)"
          archive="${work}/${NQ_GITLEAKS_ARTIFACT}"
          official_checksums="${work}/official-checksums.txt"

          curl --fail --silent --show-error --location --output "${archive}" "${NQ_GITLEAKS_DOWNLOAD_URL}"
          curl --fail --silent --show-error --location --output "${official_checksums}" "${NQ_GITLEAKS_CHECKSUM_SOURCE}"
          mapfile -t official_matches < <(awk -v artifact="${NQ_GITLEAKS_ARTIFACT}" '$2 == artifact { print $1 }' "${official_checksums}")
          if [ "${#official_matches[@]}" -ne 1 ] || [ "${official_matches[0]}" != "${NQ_GITLEAKS_SHA256}" ]; then
            echo "Official gitleaks checksum does not match canonical lock identity" >&2
            exit 1
          fi
          pwsh -NoProfile -File ./scripts/ci/Test-DeliveryToolArchive.ps1 \
            -ToolName gitleaks -Platform linux -Architecture x64 -ArchivePath "${archive}"

          mkdir -p "${work}/tampered"
          tampered="${work}/tampered/${NQ_GITLEAKS_ARTIFACT}"
          cp "${archive}" "${tampered}"
          printf 'tamper' >> "${tampered}"
          if pwsh -NoProfile -File ./scripts/ci/Test-DeliveryToolArchive.ps1 \
              -ToolName gitleaks -Platform linux -Architecture x64 -ArchivePath "${tampered}" >/dev/null 2>&1; then
            echo "Tampered gitleaks archive unexpectedly passed checksum verification" >&2
            exit 1
          fi
          echo "Gitleaks official-checksum=PASS archive=PASS tamper-negative=PASS"

          mkdir -p "${work}/bin"
          tar -C "${work}/bin" -xzf "${archive}" gitleaks
          chmod 0755 "${work}/bin/gitleaks"

          verified_bin="$(realpath "${work}/bin/gitleaks")"
          installed="$("${verified_bin}" version)"
          echo "Verified gitleaks version: ${installed}"
          if [ "${installed}" != "${NQ_GITLEAKS_VERSION}" ]; then
            echo "Expected pinned gitleaks ${NQ_GITLEAKS_VERSION} but found ${installed}" >&2
            exit 1
          fi
          printf 'NQ_GITLEAKS_BIN=%s\n' "${verified_bin}" >> "${GITHUB_ENV}"

      - name: Build tracked safe-file list
        shell: bash
        run: |
          set -euo pipefail

          # Only the current tracked working tree. No git history, no untracked / ignored files.
          git ls-files -z > "${RUNNER_TEMP}/nq-secret-scan-tracked.0"
          : > "${RUNNER_TEMP}/nq-secret-scan-safe-files.0"

          while IFS= read -r -d '' f; do
            case "${f}" in
              .env|.env.*|*/.env|*/.env.*) continue;;
              secrets|secrets/*|*/secrets/*|credentials|credentials/*|*/credentials/*) continue;;
              *.pem|*.key|*.p12|*.jks|*.keystore) continue;;
              .git/*|*/target/*|*/node_modules/*|*/dist/*|*/build/*|*/coverage/*) continue;;
              *.log|logs/*|*/logs/*|log/*|*/log/*) continue;;
              *.dump|dumps/*|*/dumps/*|dump/*|*/dump/*) continue;;
              *.bak|*.backup|backups/*|*/backups/*|backup/*|*/backup/*) continue;;
              *) printf '%s\0' "${f}" >> "${RUNNER_TEMP}/nq-secret-scan-safe-files.0";;
            esac
          done < "${RUNNER_TEMP}/nq-secret-scan-tracked.0"

          tracked_count="$(tr -cd '\0' < "${RUNNER_TEMP}/nq-secret-scan-tracked.0" | wc -c)"
          safe_count="$(tr -cd '\0' < "${RUNNER_TEMP}/nq-secret-scan-safe-files.0" | wc -c)"
          echo "tracked=${tracked_count} safe_scanned=${safe_count} excluded=$((tracked_count - safe_count))"

      - name: Run pinned gitleaks secret scan (tracked working tree, no history)
        shell: bash
        run: |
          set -euo pipefail

          safe_list="${RUNNER_TEMP}/nq-secret-scan-safe-files.0"
          staging="${RUNNER_TEMP}/nq-secret-scan-staging"
          config="${RUNNER_TEMP}/nq-secret-scan-gitleaks.toml"
          report="${RUNNER_TEMP}/nq-secret-scan-gitleaks-report.json"

          # Stage only the tracked safe files (preserving relative paths) so gitleaks scans
          # exactly the working-tree subset, never git history or excluded files.
          rm -rf "${staging}"
          mkdir -p "${staging}"
          tar --null -T "${safe_list}" -cf - | tar -C "${staging}" -xf -

          # gitleaks config is written at runtime to RUNNER_TEMP (not a tracked file, not scanned).
          # Precise allowlist only: known fake test keys / PEM protocol constant by path, plus a
          # few exact placeholder markers by value. Core detection rules are NOT relaxed.
          cat > "${config}" <<'TOML'
          [extend]
          useDefault = true

          [allowlist]
          description = "NQ Batch 4B precise allowlist (fake test keys, PEM protocol constant, placeholder markers)"
          regexTarget = "match"
          regexes = [
            '''REPLACE_WITH_LOCAL''',
            '''CHANGE_ME''',
            '''FAKE-PLACEHOLDER''',
          ]
          paths = [
            '''.*adapter[\\/]binance[\\/]service[\\/]BinanceRuntimeConfigTest\.java$''',
            '''.*adapter[\\/]binance[\\/]service[\\/]BinanceRequestSignerTest\.java$''',
            '''.*adapter[\\/]binance[\\/]service[\\/]BinanceHttpClientTest\.java$''',
            '''.*adapter[\\/]binance[\\/]service[\\/]BinanceEd25519RequestSigner\.java$''',
            # Frozen Gate-C diagnostic record: generic-api-key false positive on a non-secret
            # WebSocket client request UUID (client.request.id, ~line 325); the credential
            # fingerprint there is already masked. docs/gates is an immutable frozen archive.
            '''.*docs[\\/]gates[\\/]gate-c[\\/]WORK\.md$''',
          ]
          TOML

          # --no-git: scan files in the staged directory only, never git history.
          # --redact: never print secret values in logs or the report.
          set +e
          pwsh -NoProfile -File ./scripts/ci/Invoke-VerifiedGitleaks.ps1 \
            -BinaryPath "${NQ_GITLEAKS_BIN}" \
            -SourcePath "${staging}" \
            -ConfigPath "${config}" \
            -ReportPath "${report}"
          rc=$?
          set -e

          if [ "${rc}" -eq 2 ]; then
            echo "gitleaks reported potential finding(s). Sanitized metadata only" \
                 "(RuleID / File / Lines / Fingerprint; never secret content / source content / commit / author):" >&2
            if command -v jq >/dev/null 2>&1 && [ -s "${report}" ]; then
              jq -r --arg s "${staging}/" \
                '.[] | "  RuleID=\(.RuleID) File=\(.File | ltrimstr($s)) Lines=\(.StartLine)-\(.EndLine) Fingerprint=\(.Fingerprint | ltrimstr($s))"' \
                "${report}" >&2 || true
            else
              grep -oE '"(RuleID|File|StartLine|EndLine|Fingerprint)":[^,}]*' "${report}" >&2 || true
            fi
            echo "Resolve each finding by a precise path+rule allowlist for a confirmed fake/test/placeholder," \
                 "or by removing a real secret. Do not broaden allowlists or disable default rules. Failing CI." >&2
            exit 1
          fi
          if [ "${rc}" -ne 0 ]; then
            echo "gitleaks scanner error exit=${rc}; failing closed." >&2
            exit "${rc}"
          fi
          echo "gitleaks: no leaks found in tracked working tree."

      - name: Run custom regex secret backstop
        shell: bash
        run: |
          set -euo pipefail

          safe_list="${RUNNER_TEMP}/nq-secret-scan-safe-files.0"
          patterns="${RUNNER_TEMP}/nq-secret-scan-patterns.txt"
          violations="${RUNNER_TEMP}/nq-secret-scan-backstop-violations.txt"
          : > "${violations}"

          append_backstop_rule() {
            local rule="$1"
            shift
            printf '%s ' "${rule}" >> "${patterns}"
            printf '%s' "$@" >> "${patterns}"
            printf '\n' >> "${patterns}"
          }

          append_backstop_rule "anthropic_key" 'sk-ant-[A-Za-z0-9_-]{20,}'
          append_backstop_rule "openai_proj_key" 'sk-proj-[A-Za-z0-9_-]{20,}'
          append_backstop_rule "openai_key" 'sk-[A-Za-z0-9]{32,}'
          append_backstop_rule "github_fine_pat" 'github_pat_[A-Za-z0-9_]{20,}'
          append_backstop_rule "github_classic_pat" 'gh[pousr]_[A-Za-z0-9]{30,}'
          append_backstop_rule "aws_akia" 'AKIA[0-9A-Z]{16}'
          append_backstop_rule "aws_asia" 'ASIA[0-9A-Z]{16}'
          append_backstop_rule "pem_private" "-----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?" "PRIVATE" " " "KEY-----"
          append_backstop_rule "slack_bot" 'xoxb-[A-Za-z0-9-]{10,}'
          append_backstop_rule "slack_user" 'xoxp-[A-Za-z0-9-]{10,}'
          append_backstop_rule "mnemonic_value" '(mnemonic|seed[_-]?phrase)["'\'']?[[:space:]]*[:=][[:space:]]*["'\'']([a-z]+[[:space:]]+){5,}[a-z]+'
          append_backstop_rule "suspicious_assignment" "(api[_-]?key|api[_-]?secret|client[_-]?secret|pass" "phrase|private[_-]?key|access[_-]?token|auth[_-]?token|encrypted_payload|decrypted_payload)[\"']?[[:space:]]*[:=][[:space:]]*[\"'][A-Za-z0-9/+_=-]{20,}[\"']"

          # Placeholder / non-real markers dropped from value-bearing patterns only.
          placeholder='REPLACE_WITH_LOCAL|CHANGE_ME|DUMMY|dummy|FAKE|fake|test-only|example|EXAMPLE|placeholder|PLACEHOLDER|YOUR_|\$\{|getenv|process\.env|import\.meta\.env|Zm9v|<[A-Za-z]'

          # Precise allowlist: PEM-material rule on the 4 known Binance fake-key / protocol-constant files.
          allow_pem='(adapter/binance/service/BinanceRuntimeConfigTest\.java|adapter/binance/service/BinanceRequestSignerTest\.java|adapter/binance/service/BinanceHttpClientTest\.java|adapter/binance/service/BinanceEd25519RequestSigner\.java)$'

          while IFS=' ' read -r name re; do
            [ -z "${name}" ] && continue
            files="$(xargs -0 grep -lE -e "${re}" < "${safe_list}" 2>/dev/null || true)"
            [ -z "${files}" ] && continue
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              if [ "${name}" = "suspicious_assignment" ] || [ "${name}" = "mnemonic_value" ]; then
                c="$(grep -InE -e "${re}" "${f}" 2>/dev/null | grep -ivE -e "${placeholder}" | wc -l)"
                [ "${c}" -eq 0 ] && continue
              fi
              if [ "${name}" = "pem_private" ] && printf '%s' "${f}" | grep -qE -e "${allow_pem}"; then
                continue
              fi
              # Report file + pattern name only. Never print source content.
              echo "${name} | ${f}" >> "${violations}"
            done <<< "${files}"
          done < "${patterns}"

          count="$(wc -l < "${violations}" | tr -d ' ')"
          if [ "${count}" -gt 0 ]; then
            echo "Custom regex backstop found ${count} non-allowlisted match(es) (file + pattern only):" >&2
            cat "${violations}" >&2
            exit 1
          fi
          echo "Custom regex backstop: no non-allowlisted matches over tracked safe tree."

      - name: Verify CI log redaction proof
        shell: bash
        run: |
          set -euo pipefail

          proof_root="${RUNNER_TEMP}/nq-ci-log-redaction-proof"
          proof_logs="${proof_root}/logs"
          proof_log="${proof_logs}/security-redaction.log"
          patterns="${proof_root}/rules.tsv"
          violations="${proof_root}/violations.txt"

          rm -rf "${proof_root}"
          mkdir -p "${proof_logs}"
          : > "${patterns}"
          : > "${violations}"

          cat > "${proof_log}" <<'LOG'
          rule=SECRET_ASSIGNMENT file=backend.log status=redacted
          rule=API_KEY_ASSIGNMENT file=backend.log status=redacted
          rule=AUTH_HEADER file=backend.log status=redacted
          rule=COOKIE_HEADER file=backend.log status=redacted
          rule=PRIVATE_KEY_BLOCK file=backend.log status=redacted
          rule=RAW_BODY file=backend.log status=redacted
          rule=EXCHANGE_HOST file=backend.log status=redacted
          LOG

          append_rule() {
            local rule="$1"
            shift
            printf '%s\t' "${rule}" >> "${patterns}"
            printf '%s' "$@" >> "${patterns}"
            printf '\n' >> "${patterns}"
          }

          append_rule "SECRET_ASSIGNMENT" "sec" "ret" '[[:space:]]*[:=]'
          append_rule "API_KEY_CAMEL" "api" "Key" '[[:space:]]*[:=]'
          append_rule "API_KEY_SNAKE" "api" "_key" '[[:space:]]*[:=]'
          append_rule "TOKEN_ASSIGNMENT" "to" "ken" '[[:space:]]*[:=]'
          append_rule "SIGNATURE_ASSIGNMENT" "signa" "ture" '[[:space:]]*[:=]'
          append_rule "PASSPHRASE_ASSIGNMENT" "pass" "phrase" '[[:space:]]*[:=]'
          append_rule "AUTH_HEADER" "Authori" "zation" ":"
          append_rule "COOKIE_HEADER" "Co" "okie" ":"
          append_rule "PRIVATE_KEY_BLOCK" "PRIVATE" " " "KEY"
          append_rule "RAW_BODY" "raw" "Payload"
          append_rule "RAW_RESP" "raw" "_response"
          append_rule "RAW_REQ" "raw" "Request"
          append_rule "RAW_CRED" "raw" "Credential"
          append_rule "OKX_HOST" "okx" "\\." "com"
          append_rule "BINANCE_HOST" "binance" "\\." "com"

          while IFS=$'\t' read -r rule re; do
            [ -z "${rule}" ] && continue
            files="$(grep -rIlE -e "${re}" "${proof_logs}" 2>/dev/null || true)"
            [ -z "${files}" ] && continue
            while IFS= read -r mf; do
              [ -z "${mf}" ] && continue
              echo "REDACTION_HIT rule=${rule} file=${mf#"${proof_logs}/"}" >> "${violations}"
            done <<< "${files}"
          done < "${patterns}"

          if [ -s "${violations}" ]; then
            cat "${violations}" >&2
            exit 1
          fi

          echo "PROOF_OK"

  java-engineering-shadow:
    name: Java architecture guard
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate Java governance configuration
        shell: pwsh
        run: ./scripts/java-standard/verify-java-engineering-standard.ps1

      - name: Run Java engineering Shadow checker
        shell: pwsh
        run: ./scripts/java-standard/invoke-java-shadow-scan.ps1 -OutputPath artifacts/java-shadow/shadow-report.json

      - name: Upload Java Shadow report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: java-engineering-shadow-report
          path: artifacts/java-shadow/shadow-report.json
          if-no-files-found: error
          retention-days: 14
