name: NQ CI Baseline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-check:
    name: Diff check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git show --check --pretty=format: HEAD
          fi

  no-outbound-guard:
    name: No-outbound guard
    runs-on: ubuntu-latest

    env:
      CI: "true"
      NQ_NO_OUTBOUND_DENYLIST: >-
        okx.com
        www.okx.com
        my.okx.com
        binance.com
        api.binance.com
        fapi.binance.com
        dapi.binance.com
        testnet.binance.vision
        ws-api.binance.com
        ws-api.testnet.binance.vision
        stream.binance.com
        stream.binancefuture.com
        bybit.com
        api.bybit.com
        bitget.com
        gate.io
        api.gateio.ws
        coinbase.com
        api.coinbase.com
        kraken.com
        api.kraken.com
        crypto.com
        hyperliquid.xyz
        api.hyperliquid.xyz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify no exchange credential env is injected
        shell: bash
        run: |
          set -euo pipefail

          forbidden_env_names=(
            NQ_OKX_API_KEY
            NQ_OKX_API_SECRET
            NQ_OKX_API_PASSPHRASE
            NQ_OKX_DOME_API_KEY
            NQ_OKX_DOME_API_SECRET
            NQ_OKX_DOME_API_PASSPHRASE
            NQ_BINANCE_DOME_API_KEY
            NQ_BINANCE_DOME_API_SECRET
            NQ_BINANCE_DOME_PRIVATE_KEY
            NQ_BINANCE_DOME_PRIVATE_KEY_PATH
            NQ_BINANCE_REAL_API_KEY
            NQ_BINANCE_REAL_API_SECRET
            NQ_BINANCE_REAL_PRIVATE_KEY
            NQ_BINANCE_REAL_PRIVATE_KEY_PATH
            NQ_BINANCE_WS_DIAGNOSTIC_ENABLED
            NQ_BINANCE_WS_LIVE_DIAGNOSTIC
            NQ_LIVE_ENABLED
            NQ_REAL_PROVIDER_ENABLED
            NQ_REAL_CLIENT_ENABLED
          )

          for name in "${forbidden_env_names[@]}"; do
            if [[ -n "${!name-}" ]]; then
              echo "Forbidden exchange credential/live env is set: ${name}" >&2
              exit 1
            fi
          done

      - name: Verify exchange denylist coverage
        shell: bash
        run: |
          set -euo pipefail

          required_hosts=(
            okx.com
            www.okx.com
            my.okx.com
            binance.com
            api.binance.com
            fapi.binance.com
            dapi.binance.com
            testnet.binance.vision
            ws-api.binance.com
            ws-api.testnet.binance.vision
            stream.binance.com
            stream.binancefuture.com
            bybit.com
            api.bybit.com
            bitget.com
            gate.io
            api.gateio.ws
            coinbase.com
            api.coinbase.com
            kraken.com
            api.kraken.com
            crypto.com
            hyperliquid.xyz
            api.hyperliquid.xyz
          )

          for host in "${required_hosts[@]}"; do
            if [[ " ${NQ_NO_OUTBOUND_DENYLIST} " != *" ${host} "* ]]; then
              echo "No-outbound denylist missing required host: ${host}" >&2
              exit 1
            fi
          done

      - name: Run no-outbound guard tests
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-app -am test \
            -Dtest=NoOutboundExchangeGuardTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dnq.no-outbound.guard.required=true

  backend:
    name: Backend Maven test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: nexus_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_quant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NQ_DB_URL: jdbc:postgresql://localhost:5432/nexus_quant
      NQ_DB_USER: postgres
      NQ_DB_PASSWORD: "123456"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare backend CI legacy account fixture
        shell: bash
        run: |
          set -euo pipefail

          fixture_dir="${RUNNER_TEMP}/nq-backend-ci-fixture"
          mkdir -p "${fixture_dir}"

          mvn -f backend/pom.xml -pl nq-app -am process-classes \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -DincludeScope=runtime \
            -Dmdep.outputFile=target/backend-ci-fixture-classpath.txt

          cat > "${fixture_dir}/BackendCiLegacyAccountFixture.java" <<'JAVA'
          import java.sql.Connection;
          import java.sql.DriverManager;
          import java.sql.PreparedStatement;
          import java.sql.ResultSet;

          import org.flywaydb.core.Flyway;
          import org.flywaydb.core.api.MigrationInfo;

          public final class BackendCiLegacyAccountFixture {
              private static final String EXPECTED_VERSION = "31";
              private static final String FIXTURE_ACCOUNT_CODE = "ci-backend-test-account";

              private BackendCiLegacyAccountFixture() {
              }

              public static void main(String[] args) throws Exception {
                  String url = requireEnv("NQ_DB_URL");
                  String user = requireEnv("NQ_DB_USER");
                  String password = requireEnv("NQ_DB_PASSWORD");

                  Flyway flyway = Flyway.configure()
                          .dataSource(url, user, password)
                          .locations("classpath:db/migration")
                          .baselineOnMigrate(false)
                          .cleanDisabled(true)
                          .outOfOrder(false)
                          .load();

                  flyway.migrate();
                  flyway.validate();
                  MigrationInfo current = flyway.info().current();
                  String currentVersion = current == null || current.getVersion() == null
                          ? null
                          : current.getVersion().getVersion();
                  if (!EXPECTED_VERSION.equals(currentVersion)) {
                      throw new IllegalStateException(
                              "Expected Flyway current version " + EXPECTED_VERSION + " but got " + currentVersion);
                  }

                  try (Connection connection = DriverManager.getConnection(url, user, password)) {
                      insertLegacyAccount(connection);
                      long legacyAccountRows = count(connection,
                              "SELECT COUNT(*) FROM accounts WHERE account_code = ? AND venue = 'PAPER' AND status = 'ACTIVE'",
                              FIXTURE_ACCOUNT_CODE);
                      long exchangeAccountRows = count(connection,
                              """
                                      SELECT COUNT(*)
                                      FROM exchange_accounts
                                      WHERE account_alias = ?
                                         OR legacy_account_id IN (
                                             SELECT account_id FROM accounts WHERE account_code = ?
                                         )
                                      """,
                              FIXTURE_ACCOUNT_CODE,
                              FIXTURE_ACCOUNT_CODE);
                      long credentialRows = count(connection, "SELECT COUNT(*) FROM exchange_account_credentials");

                      if (legacyAccountRows != 1) {
                          throw new IllegalStateException("Expected exactly one backend CI legacy account fixture row");
                      }
                      if (exchangeAccountRows != 0) {
                          throw new IllegalStateException("Backend CI fixture must not create exchange_accounts rows");
                      }
                      if (credentialRows != 0) {
                          throw new IllegalStateException("Backend CI fixture must not create credential rows");
                      }
                  }

                  System.out.println("Prepared backend CI legacy account fixture after Flyway V" + EXPECTED_VERSION);
              }

              private static void insertLegacyAccount(Connection connection) throws Exception {
                  try (PreparedStatement statement = connection.prepareStatement(
                          """
                                  INSERT INTO accounts (account_code, venue, status)
                                  VALUES (?, 'PAPER', 'ACTIVE')
                                  ON CONFLICT (account_code) DO NOTHING
                                  """)) {
                      statement.setString(1, FIXTURE_ACCOUNT_CODE);
                      statement.executeUpdate();
                  }
              }

              private static long count(Connection connection, String sql, String... args) throws Exception {
                  try (PreparedStatement statement = connection.prepareStatement(sql)) {
                      for (int i = 0; i < args.length; i++) {
                          statement.setString(i + 1, args[i]);
                      }
                      try (ResultSet resultSet = statement.executeQuery()) {
                          resultSet.next();
                          return resultSet.getLong(1);
                      }
                  }
              }

              private static String requireEnv(String name) {
                  String value = System.getenv(name);
                  if (value == null || value.isBlank()) {
                      throw new IllegalStateException("Missing required environment variable: " + name);
                  }
                  return value;
              }
          }
          JAVA

          app_cp="$(cat backend/nq-app/target/backend-ci-fixture-classpath.txt)"
          classpath="backend/nq-app/target/classes:backend/nq-infra/target/classes:${app_cp}"

          javac -cp "${classpath}" "${fixture_dir}/BackendCiLegacyAccountFixture.java"
          java -cp "${fixture_dir}:${classpath}" BackendCiLegacyAccountFixture

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml test

  postgres-flyway:
    name: PostgreSQL / Flyway smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nq_ci_user
          POSTGRES_PASSWORD: nq_ci_password
          POSTGRES_DB: nq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nq_ci_user -d nq_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NQ_FLYWAY_DB_URL: jdbc:postgresql://localhost:5432/nq_ci
      NQ_FLYWAY_DB_USER: nq_ci_user
      NQ_FLYWAY_DB_PASSWORD: nq_ci_password

    steps:
      - name: Mask CI-only PostgreSQL connection values
        shell: bash
        run: |
          set -euo pipefail

          echo "::add-mask::${NQ_FLYWAY_DB_URL}"
          echo "::add-mask::${NQ_FLYWAY_DB_USER}"
          echo "::add-mask::${NQ_FLYWAY_DB_PASSWORD}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Prepare Flyway runtime classpath
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-app -am process-classes \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -DincludeScope=runtime \
            -Dmdep.outputFile=target/flyway-classpath.txt

      - name: Run empty database Flyway smoke
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir="${RUNNER_TEMP}/nq-flyway-smoke"
          mkdir -p "${smoke_dir}"

          cat > "${smoke_dir}/FlywaySmoke.java" <<'JAVA'
          import java.sql.Connection;
          import java.sql.DriverManager;
          import java.sql.ResultSet;
          import java.sql.Statement;

          import org.flywaydb.core.Flyway;
          import org.flywaydb.core.api.MigrationInfo;

          public final class FlywaySmoke {
              private static final String EXPECTED_VERSION = "31";

              private FlywaySmoke() {
              }

              public static void main(String[] args) throws Exception {
                  String url = requireEnv("NQ_FLYWAY_DB_URL");
                  String user = requireEnv("NQ_FLYWAY_DB_USER");
                  String password = requireEnv("NQ_FLYWAY_DB_PASSWORD");

                  Flyway flyway = Flyway.configure()
                          .dataSource(url, user, password)
                          .locations("classpath:db/migration")
                          .baselineOnMigrate(false)
                          .cleanDisabled(true)
                          .outOfOrder(false)
                          .load();

                  flyway.migrate();
                  flyway.validate();

                  MigrationInfo current = flyway.info().current();
                  String currentVersion = current == null || current.getVersion() == null
                          ? null
                          : current.getVersion().getVersion();
                  if (!EXPECTED_VERSION.equals(currentVersion)) {
                      throw new IllegalStateException(
                              "Expected Flyway current version " + EXPECTED_VERSION + " but got " + currentVersion);
                  }

                  try (Connection connection = DriverManager.getConnection(url, user, password);
                          Statement statement = connection.createStatement();
                          ResultSet resultSet = statement.executeQuery("""
                                  SELECT installed_rank, version, description, type, script, checksum, success
                                  FROM flyway_schema_history
                                  ORDER BY installed_rank
                                  """)) {
                      System.out.println("installed_rank|version|description|type|script|checksum|success");
                      while (resultSet.next()) {
                          System.out.printf("%d|%s|%s|%s|%s|%s|%s%n",
                                  resultSet.getInt("installed_rank"),
                                  resultSet.getString("version"),
                                  resultSet.getString("description"),
                                  resultSet.getString("type"),
                                  resultSet.getString("script"),
                                  resultSet.getString("checksum"),
                                  resultSet.getBoolean("success"));
                      }
                  }

                  System.out.println("Flyway empty database smoke reached V" + EXPECTED_VERSION);
              }

              private static String requireEnv(String name) {
                  String value = System.getenv(name);
                  if (value == null || value.isBlank()) {
                      throw new IllegalStateException("Missing required environment variable: " + name);
                  }
                  return value;
              }
          }
          JAVA

          app_cp="$(cat backend/nq-app/target/flyway-classpath.txt)"
          classpath="backend/nq-app/target/classes:backend/nq-infra/target/classes:${app_cp}"

          javac -cp "${classpath}" "${smoke_dir}/FlywaySmoke.java"
          java -cp "${smoke_dir}:${classpath}" FlywaySmoke

      - name: Generate PostgreSQL schema artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/postgres-flyway"
          mkdir -p "${artifact_dir}"

          nq_ci_psql_url="host=localhost port=5432 dbname=nq_ci user=nq_ci_user sslmode=disable"
          export PGPASSWORD="${NQ_FLYWAY_DB_PASSWORD}"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -Atc "
          SELECT installed_rank, version, description, type, script, checksum, installed_on, execution_time, success
          FROM flyway_schema_history
          ORDER BY installed_rank;
          " > "${artifact_dir}/flyway-info.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT table_schema, table_name, table_type
          FROM information_schema.tables
          WHERE table_schema = 'public'
          ORDER BY table_schema, table_name;
          " > "${artifact_dir}/schema-tables.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT table_schema, table_name, ordinal_position, column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_schema = 'public'
          ORDER BY table_schema, table_name, ordinal_position;
          " > "${artifact_dir}/schema-columns.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT con.conname AS constraint_name,
                 CASE con.contype
                   WHEN 'p' THEN 'PRIMARY KEY'
                   WHEN 'u' THEN 'UNIQUE'
                   WHEN 'f' THEN 'FOREIGN KEY'
                   WHEN 'c' THEN 'CHECK'
                   ELSE con.contype::text
                 END AS constraint_type,
                 nsp.nspname AS schema_name,
                 rel.relname AS table_name,
                 pg_get_constraintdef(con.oid) AS definition
          FROM pg_constraint con
          JOIN pg_class rel ON rel.oid = con.conrelid
          JOIN pg_namespace nsp ON nsp.oid = rel.relnamespace
          WHERE nsp.nspname = 'public'
          ORDER BY nsp.nspname, rel.relname, con.conname;
          " > "${artifact_dir}/schema-constraints.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT schemaname, tablename, indexname, indexdef
          FROM pg_indexes
          WHERE schemaname = 'public'
          ORDER BY tablename, indexname;
          " > "${artifact_dir}/schema-indexes.txt"

          psql "${nq_ci_psql_url}" -v ON_ERROR_STOP=1 -X -F $'\t' -P footer=off -c "
          SELECT 'table' AS object_type,
                 n.nspname AS schema_name,
                 c.relname AS table_name,
                 NULL::text AS column_name,
                 obj_description(c.oid, 'pg_class') AS comment
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p')
          UNION ALL
          SELECT 'column' AS object_type,
                 n.nspname AS schema_name,
                 c.relname AS table_name,
                 a.attname AS column_name,
                 col_description(c.oid, a.attnum) AS comment
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          JOIN pg_attribute a ON a.attrelid = c.oid
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r', 'p')
            AND a.attnum > 0
            AND NOT a.attisdropped
          ORDER BY schema_name, table_name, object_type, column_name NULLS FIRST;
          " > "${artifact_dir}/schema-comments.txt"

          pg_dump --schema-only --no-owner --no-privileges "${nq_ci_psql_url}" > "${artifact_dir}/schema-dump.sql"

      - name: Check PostgreSQL schema artifacts
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir="artifacts/postgres-flyway"
          required_artifacts=(
            "flyway-info.txt"
            "schema-tables.txt"
            "schema-columns.txt"
            "schema-constraints.txt"
            "schema-indexes.txt"
            "schema-comments.txt"
            "schema-dump.sql"
          )

          for artifact in "${required_artifacts[@]}"; do
            test -s "${artifact_dir}/${artifact}"
          done

          if grep -RInE '(^INSERT INTO |^COPY .+ FROM stdin;|^-- Data for Name:|^\\\.)' "${artifact_dir}/schema-dump.sql"; then
            echo "schema-dump.sql appears to contain data rows" >&2
            exit 1
          fi

          if grep -RInE '(\.env|BEGIN [A-Z ]*PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9_-]{20,}|apiKey[[:space:]]*[:=]|secret[[:space:]]*[:=]|passphrase[[:space:]]*[:=]|token[[:space:]]*[:=]|cookie[[:space:]]*[:=]|private[[:space:]_-]*key[[:space:]]*[:=]|mnemonic[[:space:]]*[:=]|credential[[:space:]_-]*material[[:space:]]*[:=]|raw[[:space:]_-]*request[[:space:]]*[:=]|raw[[:space:]_-]*response[[:space:]]*[:=])' "${artifact_dir}"; then
            echo "Schema artifact redaction check found high-risk credential material pattern" >&2
            exit 1
          fi

      - name: Upload PostgreSQL schema artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nq-postgres-flyway-schema-artifacts
          path: artifacts/postgres-flyway/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && 14 || 7 }}

      - name: Run repository PostgreSQL smoke
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-infra -am test \
            -Dtest=JdbcRepositoryPostgresSmokeTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dnq.postgres.smoke.required=true \
            -Dnq.postgres.smoke.url="${NQ_FLYWAY_DB_URL}" \
            -Dnq.postgres.smoke.user="${NQ_FLYWAY_DB_USER}" \
            -Dnq.postgres.smoke.password="${NQ_FLYWAY_DB_PASSWORD}"

      - name: Run nq-app PostgreSQL context smoke
        shell: bash
        run: |
          set -euo pipefail

          mvn -f backend/pom.xml -pl nq-app -am test \
            -Dtest=NqAppContextPostgresSmokeTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dnq.app.context.smoke.required=true \
            -Dnq.app.context.smoke.url="${NQ_FLYWAY_DB_URL}" \
            -Dnq.app.context.smoke.user="${NQ_FLYWAY_DB_USER}" \
            -Dnq.app.context.smoke.password="${NQ_FLYWAY_DB_PASSWORD}"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    env:
      CI: "true"

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  research:
    name: Research quality gate
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    defaults:
      run:
        working-directory: research/py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/py/pyproject.toml

      - name: Install research dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run mypy
        run: python -m mypy src --no-sqlite-cache

      - name: Run ruff
        run: python -m ruff check . --no-cache

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      CI: "true"
      GITLEAKS_VERSION: "8.18.4"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail

          # Pinned version only (no 'latest'); no token / auth header is passed to the download.
          version="${GITLEAKS_VERSION}"
          work="$(mktemp -d)"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${asset}"

          curl --fail --silent --show-error --location --output "${work}/${asset}" "${url}"
          tar -C "${work}" -xzf "${work}/${asset}" gitleaks
          sudo install -m 0755 "${work}/gitleaks" /usr/local/bin/gitleaks

          installed="$(gitleaks version)"
          echo "Installed gitleaks version: ${installed}"
          if [ "${installed}" != "${version}" ]; then
            echo "Expected pinned gitleaks ${version} but found ${installed}" >&2
            exit 1
          fi

      - name: Build tracked safe-file list
        shell: bash
        run: |
          set -euo pipefail

          # Only the current tracked working tree. No git history, no untracked / ignored files.
          git ls-files -z > "${RUNNER_TEMP}/nq-secret-scan-tracked.0"
          : > "${RUNNER_TEMP}/nq-secret-scan-safe-files.0"

          while IFS= read -r -d '' f; do
            case "${f}" in
              .env|.env.*|*/.env|*/.env.*) continue;;
              secrets|secrets/*|*/secrets/*|credentials|credentials/*|*/credentials/*) continue;;
              *.pem|*.key|*.p12|*.jks|*.keystore) continue;;
              .git/*|*/target/*|*/node_modules/*|*/dist/*|*/build/*|*/coverage/*) continue;;
              *.log|logs/*|*/logs/*|log/*|*/log/*) continue;;
              *.dump|dumps/*|*/dumps/*|dump/*|*/dump/*) continue;;
              *.bak|*.backup|backups/*|*/backups/*|backup/*|*/backup/*) continue;;
              *) printf '%s\0' "${f}" >> "${RUNNER_TEMP}/nq-secret-scan-safe-files.0";;
            esac
          done < "${RUNNER_TEMP}/nq-secret-scan-tracked.0"

          tracked_count="$(tr -cd '\0' < "${RUNNER_TEMP}/nq-secret-scan-tracked.0" | wc -c)"
          safe_count="$(tr -cd '\0' < "${RUNNER_TEMP}/nq-secret-scan-safe-files.0" | wc -c)"
          echo "tracked=${tracked_count} safe_scanned=${safe_count} excluded=$((tracked_count - safe_count))"

      - name: Run pinned gitleaks secret scan (tracked working tree, no history)
        shell: bash
        run: |
          set -euo pipefail

          safe_list="${RUNNER_TEMP}/nq-secret-scan-safe-files.0"
          staging="${RUNNER_TEMP}/nq-secret-scan-staging"
          config="${RUNNER_TEMP}/nq-secret-scan-gitleaks.toml"
          report="${RUNNER_TEMP}/nq-secret-scan-gitleaks-report.json"

          # Stage only the tracked safe files (preserving relative paths) so gitleaks scans
          # exactly the working-tree subset, never git history or excluded files.
          rm -rf "${staging}"
          mkdir -p "${staging}"
          tar --null -T "${safe_list}" -cf - | tar -C "${staging}" -xf -

          # gitleaks config is written at runtime to RUNNER_TEMP (not a tracked file, not scanned).
          # Precise allowlist only: known fake test keys / PEM protocol constant by path, plus a
          # few exact placeholder markers by value. Core detection rules are NOT relaxed.
          cat > "${config}" <<'TOML'
          [extend]
          useDefault = true

          [allowlist]
          description = "NQ Batch 4B precise allowlist (fake test keys, PEM protocol constant, placeholder markers)"
          regexTarget = "match"
          regexes = [
            '''REPLACE_WITH_LOCAL''',
            '''CHANGE_ME''',
            '''FAKE-PLACEHOLDER''',
          ]
          paths = [
            '''.*adapter/binance/service/BinanceRuntimeConfigTest\.java$''',
            '''.*adapter/binance/service/BinanceRequestSignerTest\.java$''',
            '''.*adapter/binance/service/BinanceHttpClientTest\.java$''',
            '''.*adapter/binance/service/BinanceEd25519RequestSigner\.java$''',
            # Frozen Gate-C diagnostic record: generic-api-key false positive on a non-secret
            # WebSocket client request UUID (client.request.id, ~line 325); the real credential
            # there is already masked (apiKey=<masked>). docs/gates is an immutable frozen archive.
            '''.*docs/gates/gate-c/WORK\.md$''',
          ]
          TOML

          # --no-git: scan files in the staged directory only, never git history.
          # --redact: never print secret values in logs or the report.
          set +e
          gitleaks detect \
            --source "${staging}" \
            --no-git \
            --config "${config}" \
            --redact \
            --report-format json \
            --report-path "${report}" \
            --exit-code 1 \
            --no-banner
          rc=$?
          set -e

          if [ "${rc}" -ne 0 ]; then
            echo "gitleaks reported potential secret(s). Sanitized finding metadata only" \
                 "(RuleID / File / Lines / Fingerprint; never Secret / Match / matched line / commit / author):" >&2
            if command -v jq >/dev/null 2>&1 && [ -s "${report}" ]; then
              jq -r --arg s "${staging}/" \
                '.[] | "  RuleID=\(.RuleID) File=\(.File | ltrimstr($s)) Lines=\(.StartLine)-\(.EndLine) Fingerprint=\(.Fingerprint | ltrimstr($s))"' \
                "${report}" >&2 || true
            else
              grep -oE '"(RuleID|File|StartLine|EndLine|Fingerprint)":[^,}]*' "${report}" >&2 || true
            fi
            echo "Resolve each finding by a precise path+rule allowlist for a confirmed fake/test/placeholder," \
                 "or by removing a real secret. Do not broaden allowlists or disable default rules. Failing CI." >&2
            exit 1
          fi
          echo "gitleaks: no leaks found in tracked working tree."

      - name: Run custom regex secret backstop
        shell: bash
        run: |
          set -euo pipefail

          safe_list="${RUNNER_TEMP}/nq-secret-scan-safe-files.0"
          patterns="${RUNNER_TEMP}/nq-secret-scan-patterns.txt"
          violations="${RUNNER_TEMP}/nq-secret-scan-backstop-violations.txt"
          : > "${violations}"

          # NAME<space>ERE per line. Quoted heredoc: regex meta-characters are not expanded.
          cat > "${patterns}" <<'PATTERNS'
          anthropic_key sk-ant-[A-Za-z0-9_-]{20,}
          openai_proj_key sk-proj-[A-Za-z0-9_-]{20,}
          openai_key sk-[A-Za-z0-9]{32,}
          github_fine_pat github_pat_[A-Za-z0-9_]{20,}
          github_classic_pat gh[pousr]_[A-Za-z0-9]{30,}
          aws_akia AKIA[0-9A-Z]{16}
          aws_asia ASIA[0-9A-Z]{16}
          pem_private -----BEGIN (RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----
          slack_bot xoxb-[A-Za-z0-9-]{10,}
          slack_user xoxp-[A-Za-z0-9-]{10,}
          mnemonic_value (mnemonic|seed[_-]?phrase)["']?[[:space:]]*[:=][[:space:]]*["']([a-z]+[[:space:]]+){5,}[a-z]+
          suspicious_assignment (api[_-]?key|api[_-]?secret|client[_-]?secret|passphrase|private[_-]?key|access[_-]?token|auth[_-]?token|encrypted_payload|decrypted_payload)["']?[[:space:]]*[:=][[:space:]]*["'][A-Za-z0-9/+_=-]{20,}["']
          PATTERNS

          # Placeholder / non-real markers dropped from value-bearing patterns only.
          placeholder='REPLACE_WITH_LOCAL|CHANGE_ME|DUMMY|dummy|FAKE|fake|test-only|example|EXAMPLE|placeholder|PLACEHOLDER|YOUR_|\$\{|getenv|process\.env|import\.meta\.env|Zm9v|<[A-Za-z]'

          # Precise allowlist: pem_private rule on the 4 known Binance fake-key / protocol-constant files.
          allow_pem='(adapter/binance/service/BinanceRuntimeConfigTest\.java|adapter/binance/service/BinanceRequestSignerTest\.java|adapter/binance/service/BinanceHttpClientTest\.java|adapter/binance/service/BinanceEd25519RequestSigner\.java)$'

          while IFS=' ' read -r name re; do
            [ -z "${name}" ] && continue
            files="$(xargs -0 grep -lE -e "${re}" < "${safe_list}" 2>/dev/null || true)"
            [ -z "${files}" ] && continue
            while IFS= read -r f; do
              [ -z "${f}" ] && continue
              if [ "${name}" = "suspicious_assignment" ] || [ "${name}" = "mnemonic_value" ]; then
                c="$(grep -InE -e "${re}" "${f}" 2>/dev/null | grep -ivE -e "${placeholder}" | wc -l)"
                [ "${c}" -eq 0 ] && continue
              fi
              if [ "${name}" = "pem_private" ] && printf '%s' "${f}" | grep -qE -e "${allow_pem}"; then
                continue
              fi
              # Report file + pattern name only. Never print the matched value.
              echo "${name} | ${f}" >> "${violations}"
            done <<< "${files}"
          done < "${patterns}"

          count="$(wc -l < "${violations}" | tr -d ' ')"
          if [ "${count}" -gt 0 ]; then
            echo "Custom regex backstop found ${count} non-allowlisted match(es) (file + pattern only):" >&2
            cat "${violations}" >&2
            exit 1
          fi
          echo "Custom regex backstop: no non-allowlisted matches over tracked safe tree."
