name: NQ CI Baseline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-check:
    name: Diff check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "${{ github.event.before }}" "${{ github.sha }}"
          else
            git show --check --pretty=format: HEAD
          fi

  backend:
    name: Backend Maven test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: nexus_quant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexus_quant"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      NQ_DB_URL: jdbc:postgresql://localhost:5432/nexus_quant
      NQ_DB_USER: postgres
      NQ_DB_PASSWORD: "123456"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run backend tests
        shell: bash
        run: |
          set -euo pipefail

          (
            set -euo pipefail
            for _ in {1..180}; do
              container="$(docker ps --filter "ancestor=postgres:16" --format "{{.ID}}" | head -n 1)"
              if [[ -n "${container}" ]] && docker exec "${container}" psql -U postgres -d nexus_quant -tAc "SELECT to_regclass('public.accounts')" 2>/dev/null | grep -q "accounts"; then
                docker exec "${container}" psql -U postgres -d nexus_quant -v ON_ERROR_STOP=1 -c "INSERT INTO accounts (account_code, venue, status) VALUES ('ci-local-account', 'PAPER', 'ACTIVE') ON CONFLICT (account_code) DO NOTHING;"
                exit 0
              fi
              sleep 1
            done
            echo "CI seed watcher timed out waiting for accounts table" >&2
            exit 1
          ) &
          seed_pid="$!"

          set +e
          mvn -f backend/pom.xml test
          mvn_status="$?"
          wait "${seed_pid}"
          seed_status="$?"
          set -e

          if [[ "${mvn_status}" -ne 0 ]]; then
            exit "${mvn_status}"
          fi
          exit "${seed_status}"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    env:
      CI: "true"

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  research:
    name: Research quality gate
    runs-on: ubuntu-latest

    env:
      CI: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    defaults:
      run:
        working-directory: research/py

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/py/pyproject.toml

      - name: Install research dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q

      - name: Run mypy
        run: python -m mypy src --no-sqlite-cache

      - name: Run ruff
        run: python -m ruff check . --no-cache
